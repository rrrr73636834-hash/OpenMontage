name: Make 3 Videos
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  business:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg+ffprobe
        run: |
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
      - name: Install Python deps
        run: pip install edge-tts faster-whisper requests python-dotenv soundfile kokoro -q
      - name: Make video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python documentary.py "How Enron Destroyed 20000 Lives" --duration 25 --lang en
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO=$(find projects -name "final.mp4" | head -1)
          TAG="enron-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$VIDEO#enron_documentary.mp4" --title "Enron Documentary" --notes "AI"

  stoicism:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg+ffprobe
        run: |
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
      - name: Install Python deps
        run: pip install edge-tts faster-whisper requests python-dotenv soundfile kokoro -q
      - name: Make video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python documentary.py "How Marcus Aurelius Mastered Self Control" --duration 20 --lang en
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO=$(find projects -name "final.mp4" | head -1)
          TAG="marcus-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$VIDEO#marcus_documentary.mp4" --title "Marcus Aurelius" --notes "AI"

  sleep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg+ffprobe
        run: |
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
      - name: Install Python deps
        run: pip install requests python-dotenv soundfile -q
      - name: Make video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python soundscape.py "Dark Forest Rain for Deep Sleep" --mood rain --hours 8
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIDEO=$(find soundscapes -name "final.mp4" | head -1)
          TAG="sleep-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$VIDEO#sleep_soundscape.mp4" --title "Sleep Soundscape 8H" --notes "AI"
