name: Make 3 Videos
on:
  workflow_dispatch:

jobs:
  business:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (static, no apt)
        run: |
          pip install imageio-ffmpeg -q
          FFMPEG=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          sudo ln -sf "$FFMPEG" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
      - name: Install Python deps
        run: pip install edge-tts faster-whisper requests python-dotenv -q
      - name: Make video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python documentary.py "How Enron Destroyed 20000 Lives" --duration 25 --lang en
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enron-video
          path: projects/*/final.mp4

  stoicism:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (static, no apt)
        run: |
          pip install imageio-ffmpeg -q
          FFMPEG=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          sudo ln -sf "$FFMPEG" /usr/local/bin/ffmpeg
      - name: Install Python deps
        run: pip install edge-tts faster-whisper requests python-dotenv -q
      - name: Make video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python documentary.py "How Marcus Aurelius Mastered Self Control" --duration 20 --lang en
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marcus-video
          path: projects/*/final.mp4

  sleep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (static, no apt)
        run: |
          pip install imageio-ffmpeg -q
          FFMPEG=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          sudo ln -sf "$FFMPEG" /usr/local/bin/ffmpeg
      - name: Install Python deps
        run: pip install requests python-dotenv -q
      - name: Make video
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python soundscape.py "Dark Forest Rain for Deep Sleep" --mood rain --hours 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sleep-video
          path: soundscapes/*/final.mp4
