name: Make 3 Videos
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  financial_crime:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests kaggle
      - name: Run pipeline
        env:
          KAGGLE_USERNAME:    ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:         ${{ secrets.KAGGLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python kaggle_run.py --niche financial_crime \
            --topic "The FTX Collapse: How Sam Bankman-Fried Lost Everything" \
            --duration 15 --lang en --output ./out_financial
      - name: Upload
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          VIDEO=$(find ./out_financial -name "final.mp4" | head -1)
          TAG="financial-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$VIDEO#ftx_collapse.mp4" --title "Financial Crime: FTX Collapse" --notes "FLUX.1+Kokoro+Whisper"

  empire_collapse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests kaggle
      - name: Run pipeline
        env:
          KAGGLE_USERNAME:    ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:         ${{ secrets.KAGGLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python kaggle_run.py --niche empire_collapse \
            --topic "Why Rome Fell: The Final Days of an Empire" \
            --duration 20 --lang en --output ./out_empire
      - name: Upload
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          VIDEO=$(find ./out_empire -name "final.mp4" | head -1)
          TAG="empire-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$VIDEO#rome_fell.mp4" --title "Empire: Why Rome Fell" --notes "FLUX.1+Kokoro+Whisper"

  dark_psychology:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests kaggle
      - name: Run pipeline
        env:
          KAGGLE_USERNAME:    ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:         ${{ secrets.KAGGLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python kaggle_run.py --niche dark_psychology \
            --topic "How Ted Bundy Manipulated Everyone Around Him" \
            --duration 15 --lang en --output ./out_psychology
      - name: Upload
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          VIDEO=$(find ./out_psychology -name "final.mp4" | head -1)
          TAG="psychology-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$VIDEO#ted_bundy.mp4" --title "Psychology: Ted Bundy" --notes "FLUX.1+Kokoro+Whisper"
