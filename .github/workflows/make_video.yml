name: Make 3 Videos
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  financial_crime:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install deps
        run: |
          pip install requests python-dotenv kokoro>=0.9.4 soundfile numpy faster-whisper kaggle
          sudo apt-get install -y ffmpeg --fix-missing || pip install imageio-ffmpeg
      - name: Run
        env:
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KAGGLE_USERNAME:    ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:         ${{ secrets.KAGGLE_KEY }}
        run: |
          python documentary.py "The FTX Collapse: How Sam Bankman-Fried Lost Everything" \
            --niche financial_crime --duration 15 --lang en
      - name: Upload
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          VIDEO=$(find productions -name "final.mp4" | head -1)
          TAG="financial-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$VIDEO#ftx.mp4" --title "Financial Crime: FTX" --notes "hybrid pipeline"

  empire_collapse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install deps
        run: |
          pip install requests python-dotenv kokoro>=0.9.4 soundfile numpy faster-whisper kaggle
          sudo apt-get install -y ffmpeg --fix-missing || pip install imageio-ffmpeg
      - name: Run
        env:
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KAGGLE_USERNAME:    ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:         ${{ secrets.KAGGLE_KEY }}
        run: |
          python documentary.py "Why Rome Fell: The Final Days of an Empire" \
            --niche empire_collapse --duration 20 --lang en
      - name: Upload
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          VIDEO=$(find productions -name "final.mp4" | head -1)
          TAG="empire-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$VIDEO#rome.mp4" --title "Empire: Why Rome Fell" --notes "hybrid pipeline"

  dark_psychology:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install deps
        run: |
          pip install requests python-dotenv kokoro>=0.9.4 soundfile numpy faster-whisper kaggle
          sudo apt-get install -y ffmpeg --fix-missing || pip install imageio-ffmpeg
      - name: Run
        env:
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KAGGLE_USERNAME:    ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:         ${{ secrets.KAGGLE_KEY }}
        run: |
          python documentary.py "How Ted Bundy Manipulated Everyone Around Him" \
            --niche dark_psychology --duration 15 --lang en
      - name: Upload
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          VIDEO=$(find productions -name "final.mp4" | head -1)
          TAG="psychology-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$VIDEO#bundy.mp4" --title "Psychology: Ted Bundy" --notes "hybrid pipeline"
